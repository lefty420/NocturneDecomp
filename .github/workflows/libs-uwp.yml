name: libs-uwp

# UWP builds of the third-party libraries the game needs (SDL2_ttf + FreeType, FFmpeg).
on:
  workflow_dispatch:
  push:
    branches: [xbox-uwp-gles-groundwork]
    paths: ['.github/workflows/libs-uwp.yml', 'packaging/uwp/libs-ttf/**']

jobs:
  sdl-ttf-uwp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDL2 headers and SDL2_ttf (with FreeType/HarfBuzz)
        shell: pwsh
        run: |
          git clone -q --depth 1 -b release-2.30.0 https://github.com/libsdl-org/SDL "$env:RUNNER_TEMP\sdl"
          git clone -q --depth 1 --recurse-submodules --shallow-submodules -b release-2.22.0 https://github.com/libsdl-org/SDL_ttf "$env:RUNNER_TEMP\sdl_ttf" 2>&1 | Out-File fetch.txt
          Get-ChildItem "$env:RUNNER_TEMP\sdl_ttf\external" | ForEach-Object { "external: $($_.Name) $((Get-ChildItem $_.FullName | Measure-Object).Count) entries" } | Out-File fetch.txt -Append
          python .github\scripts\annotate_log.py --title "SDL_ttf fetch" --file fetch.txt --tail 12
      - name: Configure and build for UWP (static, x64, Release)
        shell: pwsh
        run: |
          $gens = (cmake --help | Select-String -Pattern '^\*?\s+(Visual Studio \d+ \d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          "generators: $($gens -join ', ')" | Out-File build.txt
          $gen = $gens | Select-Object -First 1
          $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name | Select-Object -Last 1).Name
          $sdl = "$env:RUNNER_TEMP\sdl" -replace '\\','/'
          $ttf = "$env:RUNNER_TEMP\sdl_ttf" -replace '\\','/'
          cmake -S packaging/uwp/libs-ttf -B b -G "$gen" -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION="$sdk" `
            -DNOCTURNE_SDL_SRC="$sdl" -DNOCTURNE_TTF_SRC="$ttf" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_WARN_DEPRECATED=OFF *> configure.log
          "configure exit: $LASTEXITCODE (generator '$gen', SDK $sdk)" | Out-File build.txt -Append
          if ($LASTEXITCODE -eq 0) {
            cmake --build b --config Release -- /m /v:minimal *> msbuild.log
            "build exit: $LASTEXITCODE" | Out-File build.txt -Append
          }
          New-Item -ItemType Directory -Force out\ttf-uwp | Out-Null
          Get-ChildItem b -Recurse -Include *.lib | ForEach-Object { Copy-Item $_.FullName out\ttf-uwp; "lib: $($_.Name) $($_.Length)" | Out-File build.txt -Append }
          Copy-Item "$env:RUNNER_TEMP\sdl_ttf\SDL_ttf.h" out\ttf-uwp -ErrorAction SilentlyContinue
          Copy-Item *.log, build.txt out\ttf-uwp
          python .github\scripts\annotate_log.py --title "SDL_ttf UWP build" --file build.txt --tail 14
          if (Test-Path configure.log) { python .github\scripts\annotate_log.py --title "configure" --file configure.log --tail 12 }
          if (Test-Path msbuild.log) { python .github\scripts\annotate_log.py --title "msbuild" --file msbuild.log --tail 12 }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl2-ttf-uwp-x64
          path: out/ttf-uwp/

  ffmpeg-uwp:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf
      - name: Fetch FFmpeg
        shell: pwsh
        run: git clone -q --depth 1 -b n6.1.1 https://github.com/FFmpeg/FFmpeg "$env:RUNNER_TEMP\ffmpeg"
      - name: Configure, build, install (static, UWP x64)
        shell: msys2 {0}
        run: |
          # MSYS's own link.exe would shadow MSVC's
          rm -f /usr/bin/link.exe
          cd "$(cygpath "$RUNNER_TEMP")/ffmpeg"
          PREFIX="$(cygpath "$RUNNER_TEMP")/ffout"
          {
            echo "cl: $(which cl) ; link: $(which link)"
            echo "LIBPATH: ${LIBPATH:0:200}"
          } > "$GITHUB_WORKSPACE/ff-env.txt"
          ./configure --prefix="$PREFIX" --toolchain=msvc --arch=x86_64 --target-os=win32 --enable-cross-compile \
            --enable-static --disable-shared --disable-programs --disable-doc --disable-network --disable-debug \
            --disable-x86asm --disable-autodetect --disable-d3d11va --disable-dxva2 --disable-avdevice --disable-postproc \
            --extra-cflags="-MD -DWINAPI_FAMILY=WINAPI_FAMILY_APP -D_WIN32_WINNT=0x0A00" \
            --extra-ldflags="-APPCONTAINER WindowsApp.lib" > "$GITHUB_WORKSPACE/ff-configure.log" 2>&1
          echo "configure exit: $?" >> "$GITHUB_WORKSPACE/ff-env.txt"
          tail -n 40 ffbuild/config.log > "$GITHUB_WORKSPACE/ff-configlog-tail.log" 2>/dev/null || true
          if grep -q "configure exit: 0" "$GITHUB_WORKSPACE/ff-env.txt"; then
            make -j4 > "$GITHUB_WORKSPACE/ff-make.log" 2>&1
            echo "make exit: $?" >> "$GITHUB_WORKSPACE/ff-env.txt"
            make install > "$GITHUB_WORKSPACE/ff-install.log" 2>&1
            echo "install exit: $?" >> "$GITHUB_WORKSPACE/ff-env.txt"
          fi
          mkdir -p "$GITHUB_WORKSPACE/out/ffmpeg-uwp"
          cp -r "$PREFIX/include" "$PREFIX/lib" "$GITHUB_WORKSPACE/out/ffmpeg-uwp/" 2>/dev/null || true
          ls -l "$PREFIX/lib" 2>/dev/null | head -20 >> "$GITHUB_WORKSPACE/ff-env.txt" || true
          cp "$GITHUB_WORKSPACE"/ff-*.log "$GITHUB_WORKSPACE/ff-env.txt" "$GITHUB_WORKSPACE/out/ffmpeg-uwp/" 2>/dev/null || true
      - name: Compile mci_video.cpp against the new FFmpeg headers
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'deps'; New-Item -ItemType Directory -Force $d | Out-Null
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL "$d\sdl"
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenGL-Registry "$d\gl"
          git clone -q --depth 1 https://github.com/KhronosGroup/EGL-Registry "$d\egl"
          $R = Join-Path $PWD 'annotations\nocedit.exe\pseudocode'
          $ff = Join-Path $env:RUNNER_TEMP 'ffout\include'
          $o = & clang-cl /nologo /TP /std:c++17 /Zs /clang:-Wno-everything /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 /DNOCTURNE_GLES=1 `
            "/I$R\include" "/I$R\shims" "/I$d\sdl\include" "/I$ff" "/I$d\gl\api" "/I$d\egl\api" "$R\shims\win32\mci_video.cpp" 2>&1 | Out-String
          $errs = @($o -split "`r?`n" | Where-Object { $_ -match ': (fatal )?error: ' })
          "mci_video.cpp errors: $($errs.Count)`n" + ($errs | Select-Object -First 12 | Out-String) | Out-File mci.txt
          python .github\scripts\annotate_log.py --title "mci_video.cpp with FFmpeg headers" --file mci.txt --tail 14
          exit 0
      - name: Report
        if: always()
        shell: pwsh
        run: |
          python .github\scripts\annotate_log.py --title "FFmpeg UWP" --file ff-env.txt --tail 22
          if (Test-Path ff-configure.log) { python .github\scripts\annotate_log.py --title "ffmpeg configure" --file ff-configure.log --tail 14 }
          if (Test-Path ff-configlog-tail.log) { python .github\scripts\annotate_log.py --title "ffmpeg config.log" --file ff-configlog-tail.log --tail 25 }
          if (Test-Path ff-make.log) { python .github\scripts\annotate_log.py --title "ffmpeg make" --file ff-make.log --tail 12 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-uwp-x64
          path: out/ffmpeg-uwp/
