name: xbox-uwp

# Stage 1 of the Xbox/UWP port (see docs/xbox-uwp.md).
#   gles-syntax : the OpenGL ES 3.0 code path still compiles (both GL modes).
#   uwp-probe   : can a Windows runner compile and link a UWP-flavoured program
#                 with clang-cl? Prints what is installed so the next stage is
#                 built on facts. It builds no game code and produces no package.
#
# Runs on pushes to the port branch and by hand (Actions tab -> xbox-uwp -> Run).

on:
  workflow_dispatch:
    inputs:
      stride:
        description: 'uwp-game-compile: compile every Nth decompiled source file (1 = all, slow)'
        default: '20'
  push:
    branches: [xbox-uwp-gles-groundwork]

jobs:
  gles-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL2 and Khronos GLES headers
        run: |
          mkdir -p "$RUNNER_TEMP/deps" && cd "$RUNNER_TEMP/deps"
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL sdl
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenGL-Registry gl
          git clone -q --depth 1 https://github.com/KhronosGroup/EGL-Registry egl

      - name: Syntax-check GL files in desktop and ES modes
        run: |
          D="$RUNNER_TEMP/deps"
          R="$PWD/annotations/nocedit.exe/pseudocode"
          cd "$R/shims"
          fail=0
          for mode in 0 1; do
            for f in gl/gl_api.cpp gl/gl_blit.cpp gl/gl_present.cpp gl/gl_program.cpp \
                     renderer/trigl_gl.cpp renderer/trigl_device.cpp; do
              if clang++ -fsyntax-only -std=gnu++17 -x c++ -DNOCTURNE_GLES=$mode \
                   -I "$R/include" -I "$R/shims" -I "$D/sdl/include" \
                   -I "$D/gl/api" -I "$D/egl/api" "$f"; then
                echo "ok   GLES=$mode $f"
              else
                echo "FAIL GLES=$mode $f"; fail=1
              fi
            done
          done
          exit $fail

  uwp-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe toolchain and UWP compile/link (results shown as annotations)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = New-Object System.Collections.Generic.List[string]
          function Note($title, $text) {
            $t = ($text | Out-String).Trim()
            if ($t.Length -gt 1500) { $t = $t.Substring(0, 1500) + ' ...(truncated)' }
            Write-Host "=== $title`n$t"
            $summary.Add("### $title`n``````n$t`n``````")
            $flat = $t -replace "`r?`n", '%0A'
            Write-Host "::notice title=$title::$flat"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Note 'Visual Studio' ("path: $vs`n" + (& $vswhere -latest -products * -property catalog_productDisplayVersion))

          $inc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue | ForEach-Object Name
          Note 'Windows SDK versions' ($inc -join ', ')

          $wapp = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Recurse -Filter WindowsApp.lib -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
          Note 'WindowsApp.lib' ($wapp -join "`n")

          $clang = Get-Command clang-cl -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          Note 'clang-cl' ("$clang`n" + (& clang-cl --version 2>&1))

          # Import the MSVC x64 environment (include/lib paths) into this session.
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          Note 'vcvars64.bat exists' (Test-Path $vcvars)
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] }
          }

          Set-Content probe.cpp "#include <windows.h>`n#include <cstdio>`nint main(){ std::printf(`"uwp probe\n`"); return 0; }"
          $c = & clang-cl /std:c++17 /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 /c probe.cpp 2>&1
          $compileOk = ($LASTEXITCODE -eq 0)
          Note "clang-cl compile (WINAPI_FAMILY_APP): exit $LASTEXITCODE" $c

          $linkOk = $false
          if ($compileOk) {
            $l = & link /APPCONTAINER /MACHINE:X64 probe.obj WindowsApp.lib 2>&1
            $linkOk = ($LASTEXITCODE -eq 0)
            Note "link /APPCONTAINER WindowsApp.lib: exit $LASTEXITCODE" $l
          }

          $summary | Set-Content $env:GITHUB_STEP_SUMMARY
          if (-not ($compileOk -and $linkOk)) { exit 1 }

  # Informational: always succeeds. Compiles every shim source under the UWP
  # API family with clang-cl and reports what fails, so the Win32/POSIX calls UWP
  # rejects can be fixed in order. Syntax-only; produces no binary.
  uwp-shim-compile:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL2 and Khronos GLES headers
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'deps'
          New-Item -ItemType Directory -Force $d | Out-Null
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL "$d\sdl"
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenGL-Registry "$d\gl"
          git clone -q --depth 1 https://github.com/KhronosGroup/EGL-Registry "$d\egl"
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL_ttf "$d\ttf"
          # Some sources write <SDL2/SDL.h>; give that spelling a home.
          New-Item -ItemType Directory -Force "$d\inc" | Out-Null
          Copy-Item "$d\sdl\include" "$d\inc\SDL2" -Recurse

      - name: Compile shims under WINAPI_FAMILY_APP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'deps'
          $R = Join-Path $PWD 'annotations\nocedit.exe\pseudocode'

          # MSVC x64 environment (include/lib paths).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') { Set-Item -Path "env:$($Matches[1])" -Value $Matches[2] }
          }

          function Annotate($title, $text) {
            $t = ($text | Out-String).Trim()
            if ($t.Length -gt 1800) { $t = $t.Substring(0, 1800) + ' ...(truncated)' }
            $t = $t -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::notice title=$title::$t"
          }

          $files = Get-ChildItem "$R\shims" -Recurse -Include *.cpp,*.c |
                   Where-Object { $_.Name -ne 'winsock_posix.c' }
          $log = New-Object System.Collections.Generic.List[string]
          $perFile = @()
          $msgs = @{}
          $allErrs = New-Object System.Collections.Generic.List[string]
          $msgFiles = @{}
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($R.Length + 1)
            $out = & clang-cl /nologo /TP /std:c++17 /Zs /clang:-Wno-everything `
              /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 /DNOCTURNE_GLES=1 `
              "/I$R\include" "/I$R\shims" "/I$d\sdl\include" "/I$d\inc" "/I$d\ttf" "/I$d\gl\api" "/I$d\egl\api" `
              $f.FullName 2>&1 | Out-String
            $errs = @($out -split "`r?`n" | Where-Object { $_ -match ': (fatal )?error: ' })
            $perFile += [pscustomobject]@{ File = $rel; Errors = $errs.Count }
            $log.Add("##### $rel (errors: $($errs.Count))`n$out")
            foreach ($e in $errs) {
              $allErrs.Add(($e -replace '^.*?pseudocode\\', ''))
              $m = ($e -replace '^.*?: (fatal )?error: ', '')
              $msgs[$m] = 1 + [int]$msgs[$m]
              if (-not $msgFiles.ContainsKey($m)) { $msgFiles[$m] = New-Object 'System.Collections.Generic.HashSet[string]' }
              [void]$msgFiles[$m].Add($rel)
            }
          }

          $ok = @($perFile | Where-Object { $_.Errors -eq 0 })
          $bad = @($perFile | Where-Object { $_.Errors -gt 0 } | Sort-Object Errors -Descending)
          Annotate 'Shim compile totals' ("files: $($perFile.Count), clean: $($ok.Count), with errors: $($bad.Count), total errors: $(($perFile | Measure-Object Errors -Sum).Sum)")
          Annotate 'Worst files' (($bad | Select-Object -First 25 | ForEach-Object { "$($_.Errors)  $($_.File)" }) -join "`n")
          Annotate 'Clean files' (($ok | ForEach-Object { $_.File }) -join "`n")

          $top = $msgs.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 40
          $lines = $top | ForEach-Object { "$($_.Value)x in $($msgFiles[$_.Key].Count) files: $($_.Key)" }
          Annotate 'Top errors (1-20)' (($lines | Select-Object -First 20) -join "`n")
          Annotate 'Top errors (21-40)' (($lines | Select-Object -Skip 20) -join "`n")
          for ($i = 0; $i -lt [Math]::Min($allErrs.Count, 60); $i += 8) {
            Annotate ('Error lines ' + ($i + 1)) (($allErrs | Select-Object -Skip $i -First 8) -join "`n")
          }
          $hdr = $msgs.Keys | Where-Object { $_ -match "file not found" } | Sort-Object
          Annotate 'Missing headers' ($hdr -join "`n")

          New-Item -ItemType Directory -Force out | Out-Null
          $log | Set-Content out\shim-compile.log
          ($perFile | Sort-Object Errors -Descending | Format-Table -AutoSize | Out-String -Width 200) | Set-Content out\per-file.txt
          Get-Content out\per-file.txt | Select-Object -First 200 | Set-Content $env:GITHUB_STEP_SUMMARY
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwp-shim-compile-logs
          path: out/

  # Informational: always succeeds. Compiles an evenly spaced sample of the
  # decompiled game sources (src/, plus main/ and checks/) under the UWP API family
  # and groups the errors into families. Raise `stride` down to 1 for everything.
  uwp-game-compile:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL2, SDL_ttf and Khronos GLES headers
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'deps'
          New-Item -ItemType Directory -Force $d | Out-Null
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL "$d\sdl"
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL_ttf "$d\ttf"
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenGL-Registry "$d\gl"
          git clone -q --depth 1 https://github.com/KhronosGroup/EGL-Registry "$d\egl"
          New-Item -ItemType Directory -Force "$d\inc" | Out-Null
          Copy-Item "$d\sdl\include" "$d\inc\SDL2" -Recurse

      - name: Compile a sample of the decompiled game sources under WINAPI_FAMILY_APP
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'deps'
          $R = Join-Path $PWD 'annotations\nocedit.exe\pseudocode'
          New-Item -ItemType Directory -Force out\gen | Out-Null
          python cmake\collect_sources.py --src-root "$R\src" --module "$R\main" --module "$R\checks" `
            --out-dir out\gen --skip-list cmake\skip_list.txt --modules-file out\gen\modules.txt `
            --exclude-module entry --exclude-module crt
          $stride = '${{ github.event.inputs.stride }}'
          if (-not $stride) { $stride = '20' }
          python .github\scripts\uwp_compile.py --mode msvc --sources-dir out\gen --stride $stride --jobs 4 `
            --include "$R\include" --include "$R\shims" --include "$d\sdl\include" --include "$d\inc" `
            --include "$d\ttf" --include "$d\gl\api" --include "$d\egl\api" `
            --root "$R\" --out out\game
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwp-game-compile-logs
          path: out/game/
