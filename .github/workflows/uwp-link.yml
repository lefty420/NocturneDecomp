name: uwp-link

# Compiles the whole game (decompiled sources + shims + main) for UWP with clang-cl and links
# it against the UWP builds of SDL2, SDL2_ttf/FreeType, FFmpeg and ANGLE headers. The library
# builds are not repeated: this picks up the artifacts of their latest successful runs on this
# branch (xbox-uwp: SDL2, libs-uwp: SDL2_ttf + FFmpeg, angle-uwp: ANGLE). See docs/xbox-uwp.md.
on:
  workflow_dispatch:
  push:
    branches: [xbox-uwp-gles-groundwork]
    paths:
      - '.github/workflows/uwp-link.yml'
      - 'cmake/uwp_libs.cmake'
      - 'cmake/platforms/uwp.cmake'
      - 'cmake/toolchains/uwp-x64.cmake'
      - 'CMakeLists.txt'
      - 'packaging/uwp/launcher/**'
      - 'packaging/uwp/AppxManifest.xml'
      - '.github/scripts/make_logos.py'
      - 'annotations/nocedit.exe/pseudocode/main/**'
      - 'annotations/nocedit.exe/pseudocode/src/core/menu.cpp/**'
      - 'annotations/nocedit.exe/pseudocode/include/system/**'
      - 'annotations/nocedit.exe/pseudocode/shims/**'

jobs:
  link:
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      - name: Assemble the UWP libraries from earlier builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $L = Join-Path $env:RUNNER_TEMP 'uwplibs'
          New-Item -ItemType Directory -Force "$L\sdl", "$L\ttf", "$L\ffmpeg", "$L\angle", dl | Out-Null
          $log = 'libs.txt'
          function Latest($wf) {
            (gh run list --repo $env:GITHUB_REPOSITORY --workflow $wf --branch xbox-uwp-gles-groundwork --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          }
          $plan = @(
            @{ wf='xbox-uwp.yml';  art='sdl2-uwp-x64';     dir='sdl' },
            @{ wf='libs-uwp.yml';  art='sdl2-ttf-uwp-x64'; dir='ttf' },
            @{ wf='libs-uwp.yml';  art='ffmpeg-uwp-x64';   dir='ffmpeg' },
            @{ wf='angle-uwp.yml'; art='angle-uwp-x64';    dir='angle' })
          foreach ($p in $plan) {
            $id = Latest $p.wf
            "$($p.art): run $id" | Out-File $log -Append
            gh run download $id --repo $env:GITHUB_REPOSITORY -n $p.art -D "$L\$($p.dir)" 2>&1 | Out-File $log -Append
          }
          # SDL's headers (and its WinRT entry source) come from the source tree.
          git clone -q --depth 1 -b SDL2 https://github.com/libsdl-org/SDL "$env:RUNNER_TEMP\sdlsrc"
          Copy-Item "$env:RUNNER_TEMP\sdlsrc\include" "$L\sdl\include" -Recurse
          # A couple of shims spell it <SDL2/SDL.h>: give that form a home too.
          New-Item -ItemType Directory -Force "$L\sdl\inc" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sdlsrc\include" "$L\sdl\inc\SDL2" -Recurse
          # FFmpeg's static libraries are named .a by its build system; the linker wants .lib.
          Get-ChildItem "$L\ffmpeg" -Recurse -Filter 'lib*.a' | ForEach-Object { Copy-Item $_.FullName ([IO.Path]::ChangeExtension($_.FullName, '.lib')) }
          Get-ChildItem $L -Recurse -File | Where-Object { $_.Extension -in '.lib','.dll','.h' -and $_.FullName -notmatch '\\include\\' } |
            ForEach-Object { "$($_.FullName.Replace($L,'')) $($_.Length)" } | Out-File $log -Append
          python .github\scripts\annotate_log.py --title "UWP libraries" --file $log --tail 40
          "UWPLIBS=$L" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the WinRT entry object (needs MSVC cl and /ZW)
        shell: pwsh
        run: |
          $o = Join-Path $env:RUNNER_TEMP 'winrt_main.obj'
          cl /nologo /c /ZW /EHsc /std:c++17 /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 "/I$env:UWPLIBS\sdl\include" `
             "/Fo$o" "$env:RUNNER_TEMP\sdlsrc\src\main\winrt\SDL_winrt_main_NonXAML.cpp" 2>&1 | Tee-Object cl-winrt.txt
          # The launcher's C++/CX import providers (folder picker, USB) also need cl /ZW.
          $p = Join-Path $env:RUNNER_TEMP 'imports_uwp.obj'
          cl /nologo /c /ZW /EHsc /MD /std:c++17 /utf-8 /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 "/I$env:UWPLIBS\sdl\include" `
             "/I$PWD\packaging\uwp\launcher\src" "/Fo$p" "$PWD\packaging\uwp\launcher\src\imports_platform_uwp.cpp" 2>&1 | Tee-Object -Append cl-winrt.txt
          "WINRT_OBJ=$o;$p" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          python .github\scripts\annotate_log.py --title "WinRT entry object" --file cl-winrt.txt --tail 8

      - name: Configure
        shell: pwsh
        run: |
          $objs = $env:WINRT_OBJ -replace '\\','/'
          $libs = $env:UWPLIBS -replace '\\','/'
          cmake -S . -B build -G Ninja "-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/uwp-x64.cmake" `
            "-DNOCTURNE_BUILD_EXE=ON" "-DNOCTURNE_BUILD_CHECK=OFF" "-DNOCTURNE_USE_CCACHE=OFF" `
            "-DNOCTURNE_UWP_LIBS_DIR=$libs" "-DNOCTURNE_UWP_EXTRA_OBJECTS=$objs" "-DNOCTURNE_BUILD_TAG=exe-uwp-x64" *> configure.log
          "configure exit: $LASTEXITCODE" | Out-File configure-exit.txt
          python .github\scripts\annotate_log.py --title "Configure ($(Get-Content configure-exit.txt))" --file configure.log --tail 25 --max-errors 12
          exit 0

      - name: Compile and link
        shell: pwsh
        run: |
          if (-not (Test-Path build\build.ninja)) { "no build.ninja: configure failed" | Out-File build.log; exit 0 }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build --target nocturne -- -k 0 *> build.log
          $code = $LASTEXITCODE
          "build exit: $code after $([int]$sw.Elapsed.TotalMinutes) min" | Out-File build-exit.txt
          python .github\scripts\annotate_log.py --title "Build ($(Get-Content build-exit.txt))" --file build.log --tail 12 --max-errors 14
          # Group the errors by kind so the first screen shows what to fix first.
          $errs = Select-String -Path build.log -Pattern 'error' | ForEach-Object { $_.Line }
          $lnk  = $errs | Where-Object { $_ -match 'LNK\d+' } | Sort-Object -Unique
          $cc   = $errs | Where-Object { $_ -notmatch 'LNK\d+' } | ForEach-Object { ($_ -replace '^.*?error: ', '') -replace "'[^']*'", "'_'" } | Group-Object | Sort-Object Count -Descending | Select-Object -First 12 | ForEach-Object { "$($_.Count)x $($_.Name)" }
          ($cc -join "`n") | Out-File cc-families.txt
          ($lnk | Select-Object -First 40) -join "`n" | Out-File link-errors.txt
          if (Test-Path cc-families.txt) { python .github\scripts\annotate_log.py --title "Compile error families" --file cc-families.txt --tail 14 }
          if ((Get-Item link-errors.txt).Length -gt 4) { python .github\scripts\annotate_log.py --title "Link errors" --file link-errors.txt --tail 30 }
          exit 0

      - name: Collect output
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\uwp-link | Out-Null
          Copy-Item *.log, *.txt out\uwp-link -ErrorAction SilentlyContinue
          Get-ChildItem build -Filter 'nocturne.*' -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.exe','.pdb' } | ForEach-Object { Copy-Item $_.FullName out\uwp-link; "output: $($_.Name) $($_.Length)" }
      - name: Package (.msix, test-signed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'package.txt'
          if (-not (Test-Path build\nocturne.exe)) { "no nocturne.exe: nothing to package" | Out-File $log; python .github\scripts\annotate_log.py --title "Package" --file $log; exit 0 }
          $L = Join-Path $env:RUNNER_TEMP 'uwplibs'
          $P = 'pkg'
          New-Item -ItemType Directory -Force "$P\Assets", "$P\fonts" | Out-Null
          Copy-Item build\nocturne.exe $P
          Copy-Item "$L\sdl\SDL2.dll", "$L\angle\libEGL.dll", "$L\angle\libGLESv2.dll" $P
          Get-ChildItem "$L\ttf", "$L\ffmpeg" -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $P }
          # ANGLE compiles shaders with the D3D compiler, which a UWP app has to bring itself.
          $d3d = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Recurse -Filter d3dcompiler_47.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if ($d3d) { Copy-Item $d3d.FullName $P } else { "d3dcompiler_47.dll NOT FOUND" | Out-File $log -Append }
          # The UWP C++ runtime (vcruntime140_app and friends) normally comes from the Microsoft.VCLibs
          # framework package. Without it the app dies at launch with no message, so carry the DLLs
          # beside the exe instead; they live inside the VCLibs .appx that ships with the SDK.
          $vcl = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs" -Recurse -Filter 'Microsoft.VCLibs.x64.14.00.appx' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Retail' } | Select-Object -First 1
          if ($vcl) {
            Copy-Item $vcl.FullName vclibs.zip
            Expand-Archive vclibs.zip -DestinationPath vclibs -Force
            Get-ChildItem vclibs -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $P; "runtime: $($_.Name)" | Out-File $log -Append }
          } else { "VCLibs appx NOT FOUND" | Out-File $log -Append }
          Copy-Item packaging\uwp\launcher\assets\fonts\*.ttf "$P\fonts"
          Copy-Item packaging\uwp\launcher\assets\cover.bmp $P
          python -m pip install -q pillow 2>&1 | Out-Null
          python .github\scripts\make_logos.py "$P\Assets"
          # What the exe and each bundled DLL import: anything that is not a Windows/UWP system DLL or
          # shipped in the package makes the app die silently at launch.
          $dep = @()
          foreach ($bin in (Get-ChildItem $P -Filter *.exe), (Get-ChildItem $P -Filter *.dll)) { foreach ($b in $bin) {
            $dep += "== $($b.Name)"
            $dep += (dumpbin /dependents $b.FullName 2>&1 | Where-Object { $_ -match '^\s+\S+\.(dll|DLL)\s*$' } | ForEach-Object { $_.Trim() })
          } }
          $dep | Out-File deps.txt
          python .github\scripts\annotate_log.py --title "Imported DLLs" --file deps.txt --tail 60
          $subject = 'CN=NocturneDev'
          (Get-Content packaging\uwp\AppxManifest.xml -Raw).Replace('@PUBLISHER@', $subject).Replace('@VERSION@', '0.1.3.0') | Set-Content "$P\AppxManifest.xml" -Encoding utf8
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Where-Object Name -match '^10\.' | Sort-Object Name | Select-Object -Last 1
          $bin = Join-Path $sdk.FullName 'x64'
          New-Item -ItemType Directory -Force out\package | Out-Null
          & "$bin\makeappx.exe" pack /o /d $P /p out\package\NocturneDecomp.msix 2>&1 | Out-File $log -Append
          & "$bin\makeappx.exe" pack /o /d $P /p out\package\NocturneDecomp.appx 2>&1 | Out-File $log -Append
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature -FriendlyName 'NocturneDev test' `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pw = ConvertTo-SecureString 'nocturne' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath out\package\NocturneDev.cer | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /f cert.pfx /p nocturne out\package\NocturneDecomp.msix 2>&1 | Out-File $log -Append
          & "$bin\signtool.exe" sign /fd SHA256 /f cert.pfx /p nocturne out\package\NocturneDecomp.appx 2>&1 | Out-File $log -Append
          Get-ChildItem out\package | ForEach-Object { "package: $($_.Name) $($_.Length)" } | Out-File $log -Append
          Get-ChildItem $P -Recurse -File | ForEach-Object { "in package: $($_.FullName.Replace((Resolve-Path $P).Path,'')) $($_.Length)" } | Out-File $log -Append
          python .github\scripts\annotate_log.py --title "Package" --file $log --tail 40 --max-errors 8
      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-uwp-package
          path: out/package/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uwp-link-x64
          path: out/uwp-link/
